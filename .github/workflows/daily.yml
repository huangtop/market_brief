name: Generate Daily Market Brief

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # UTC 00:00 = Asia/Taipei 08:00.
    # Tue-Sat 08:00 Taipei, after Mon-Fri US trading sessions.
    - cron: "0 0 * * 2-6"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas_market_calendars

      - name: Check whether NYSE traded today
        id: market
        run: |
          python - <<'PY'
          import os
          import datetime as dt
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal

          now_ny = dt.datetime.now(ZoneInfo("America/New_York"))
          today = now_ny.date()

          nyse = mcal.get_calendar("NYSE")
          schedule = nyse.schedule(
              start_date=today.isoformat(),
              end_date=today.isoformat()
          )

          should_run = not schedule.empty

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")

          if should_run:
              print(f"NYSE traded on {today}. Generate brief.")
          else:
              print(f"NYSE closed on {today}. Skip OpenAI API call.")
          PY

      - name: Generate latest market brief
        if: steps.market.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: python generate_brief.py

      - name: Commit generated HTML
        if: steps.market.outputs.should_run == 'true'
        run: |
          git config user.name "market-brief-bot"
          git config user.email "market-brief-bot@users.noreply.github.com"
          git add data/latest.html data/archive/*.html
          git commit -m "Update daily market brief" || echo "No changes to commit"
          git push origin main