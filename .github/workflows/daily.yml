name: Generate Daily Market Brief

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # UTC 00:00 = Asia/Taipei 08:00.
    # Tue-Sat 08:00 Taipei, after Mon-Fri US trading sessions.
    - cron: "0 0 * * 2-6"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas_market_calendars

      - name: Check whether today's NYSE session has closed
        id: market
        run: |
          python - <<'PY'
          import os
          import datetime as dt
          from zoneinfo import ZoneInfo
          import pandas_market_calendars as mcal

          now_utc = dt.datetime.now(dt.timezone.utc)
          now_ny = now_utc.astimezone(ZoneInfo("America/New_York"))
          ny_date = now_ny.date()

          nyse = mcal.get_calendar("NYSE")
          schedule = nyse.schedule(
              start_date=ny_date.isoformat(),
              end_date=ny_date.isoformat()
          )

          market_date = ""
          should_run = False

          if schedule.empty:
              reason = f"NYSE has no session on {ny_date}."
          else:
              session_date = schedule.index[0].date()
              market_close = schedule.iloc[0]["market_close"].to_pydatetime()
              if market_close.tzinfo is None:
                  market_close = market_close.replace(tzinfo=dt.timezone.utc)
              else:
                  market_close = market_close.astimezone(dt.timezone.utc)

              if market_close <= now_utc:
                  should_run = True
                  market_date = session_date.isoformat()
                  reason = (
                      f"NYSE session {market_date} closed at "
                      f"{market_close.isoformat()}."
                  )
              else:
                  reason = (
                      f"NYSE session {session_date} is not closed yet; "
                      f"market_close={market_close.isoformat()}, "
                      f"now_utc={now_utc.isoformat()}."
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
              f.write(f"market_date={market_date}\n")

          if should_run:
              print(f"{reason} Generate brief.")
          else:
              print(f"{reason} Skip OpenAI API call.")
          PY

      - name: Generate latest market brief
        if: steps.market.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          MARKET_SESSION_DATE: ${{ steps.market.outputs.market_date }}
        run: python generate_brief.py

      - name: Commit generated HTML
        if: steps.market.outputs.should_run == 'true'
        run: |
          git config user.name "market-brief-bot"
          git config user.email "market-brief-bot@users.noreply.github.com"
          git add data/latest.html data/archive/*.html
          git commit -m "Update daily market brief" || echo "No changes to commit"
          git push origin main
